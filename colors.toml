mode = "dark"

# --- surfaces: the background is the void; cards step up one rung ----------
background         = "#080C08"
darker_background  = "#040604"
dark_background    = "#060906"
lighter_background = "#121C13"

# --- text ------------------------------------------------------------------
foreground         = "#ACD2B4"
light_foreground   = "#ACD2B4"
bright_foreground  = "#D4EDD9"
dark_foreground    = "#4A7352"
muted              = "#273A2B"

accent               = "#60C76B"
selection            = "#142E17"
selection_background = "#60C76B"
selection_foreground = "#060E07"

# --- borders: flat accent green, no gradient -------------------------------
hyprland_active_border   = "rgba(3D8F48ff)"
hyprland_inactive_border = "rgba(273A2Bcc)"
active_border_color      = "#3D8F48"
active_tab_background    = "#2E7A40"

# --- the ANSI ladder: separated by luminance, plus hue within the green ----
# Red is the film's signal red (pill, dress, alarms), blue the real world's
# steel blue -- both lightened to stay legible, because the exact film hexes
# (#C8102E at 3.3:1) cannot carry text. Brown is the Nebuchadnezzar amber.
red     = "#E5484D"
yellow  = "#B6CF7D"
orange  = "#81B851"
green   = "#60C76B"
cyan    = "#92D9BB"
blue    = "#5B8CA8"
magenta = "#4FC482"
brown   = "#A07A45"

bright_red     = "#E0605F"
bright_yellow  = "#CEE0A3"
bright_green   = "#8BDA93"
bright_cyan    = "#B9E9D5"
bright_blue    = "#6B9AB5"
bright_magenta = "#7DD8A5"
