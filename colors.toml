mode = "dark"

# --- soft-dark variant: the film's own shadows --------------------------------
# The void (#080C08) is darker and colder than any black the film ever shows:
# the pills scene sits at #171716, Neo's sleep at #0E170C, Morpheus in warm
# ambers. So this lifts the surfaces to that range with a faint warm-green
# cast, and takes the neon off the accent. The green is the monitor's own --
# yellow-leaning, the way the grade pushes it -- with the ice-blue prompt and
# the reserved red untouched. Only the glare goes.
background         = "#131610"
darker_background  = "#0B0E09"
dark_background    = "#0F120C"
lighter_background = "#1B2117"

# --- text ------------------------------------------------------------------
foreground         = "#93B298"
light_foreground   = "#9DBEA4"
bright_foreground  = "#A8C6AE"
dark_foreground    = "#7A9A80"
muted              = "#33482F"

accent               = "#7BAE4E"
selection            = "#1E3320"
selection_background = "#7BAE4E"
selection_foreground = "#0E150F"

# --- borders: soft phosphor, flat ------------------------------------------
hyprland_active_border   = "rgba(4E8F5Aff)"
hyprland_inactive_border = "rgba(33482Fcc)"
active_border_color      = "#4E8F5A"
active_tab_background    = "#4A8F57"

# --- the ANSI ladder: the film's grade, not generic terminal hues ------------
# Red is the signal red, blue the real world's steel, brown the ship's amber,
# green/yellow the monitor phosphor with its sickly yellow push. The exact
# film hexes cannot carry text (#C8102E sits at 3.1:1 here), so each is the
# closest rung that holds 4.5:1 -- measured, the way the void ladder is.
red     = "#E5484D"
yellow  = "#A8BE5A"
orange  = "#7BAE5A"
green   = "#7BAE4E"
cyan    = "#7CBCA0"
blue    = "#5B8CA8"
magenta = "#4CAF7E"
brown   = "#A07A45"

bright_red     = "#E0605F"
bright_yellow  = "#B5CC72"
bright_green   = "#82B95A"
bright_cyan    = "#8AC4A8"
bright_blue    = "#6B9AB5"
bright_magenta = "#79D0A0"
