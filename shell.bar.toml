[bar]
# The bar drops to the absolute void: darker than the windows, so it reads as
# the edge of the screen rather than as one more surface.
background       = "#000200"
background-alpha = 1.0
text             = "#A8F5BC"
active           = "#F0263F"
scale-with-font  = true
size-horizontal  = 26
size-vertical    = 28
